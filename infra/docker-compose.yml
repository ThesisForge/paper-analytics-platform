version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: papers
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/papers
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_KEY: dev-key
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
  worker:
    build: ../worker
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/papers
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_KEY: dev-key
    depends_on:
      - db
      - redis
  frontend:
    build: ../frontend
    environment:
      VITE_API_BASE: http://localhost:8000/api
    ports:
      - "4173:4173"
    depends_on:
      - backend
volumes:
  db_data:
