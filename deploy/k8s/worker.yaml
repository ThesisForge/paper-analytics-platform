apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paper-worker
  template:
    metadata:
      labels:
        app: paper-worker
    spec:
      containers:
        - name: worker
          image: paper-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paper-secrets
                  key: database_url
            - name: REDIS_URL
              value: redis://paper-redis:6379/0
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paper-secrets
                  key: admin_api_key
